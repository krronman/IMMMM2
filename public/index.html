<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Murder Mystery</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #87ceeb; font-family: system-ui, sans-serif; }
  canvas { display: block; }
  #overlay { position: fixed; inset: 0; background: rgba(0,0,0,.6); display: flex; align-items: center; justify-content: center; z-index: 10; }
  #panel { background: #fff; padding: 28px 32px; border-radius: 14px; width: 300px; text-align: center; }
  #panel h1 { margin: 0 0 6px; font-size: 22px; }
  #panel p { margin: 0 0 16px; font-size: 13px; color: #555; line-height: 1.4; }
  #panel input[type=text] { width: 100%; box-sizing: border-box; padding: 10px; font-size: 16px; margin-bottom: 12px; }
  #panel label { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; font-size: 14px; }
  #panel input[type=color] { width: 60px; height: 32px; border: none; padding: 0; }
  #panel button { width: 100%; padding: 12px; font-size: 16px; border: none; border-radius: 8px; background: #3b82f6; color: #fff; cursor: pointer; }
  .hudtext { position: fixed; color: #fff; text-shadow: 0 1px 4px #000; z-index: 5; pointer-events: none; white-space: pre-line; }
  #hud { top: 10px; left: 12px; font-size: 14px; line-height: 1.5; }
  #role { top: 56px; left: 12px; font-size: 16px; font-weight: bold; }
  #timer { top: 10px; left: 0; right: 0; text-align: center; font-size: 28px; font-weight: bold; }
  #banner { top: 16%; left: 0; right: 0; text-align: center; font-size: 22px; font-weight: bold; padding: 0 20px; }
  #roles { top: 30%; left: 0; right: 0; text-align: center; font-size: 17px; line-height: 1.6; }
  #toast { bottom: 18%; left: 0; right: 0; text-align: center; font-size: 22px; font-weight: bold; opacity: 0; transition: opacity .4s; padding: 0 20px; }
  #help { bottom: 10px; left: 0; right: 0; text-align: center; font-size: 13px; }
  #crosshair { position: fixed; top: 50%; left: 50%; width: 14px; height: 14px; margin: -7px 0 0 -7px; border: 2px solid rgba(255,255,255,.9); border-radius: 50%; box-shadow: 0 0 3px #000; z-index: 5; pointer-events: none; display: none; }
</style>
</head>
<body>
<div id="overlay">
  <div id="panel">
    <h1>🔪 Murder Mystery</h1>
    <p>5+ players needed. One Murderer, one Sheriff, everyone else is Innocent. Roles are secret!</p>
    <input id="name" type="text" maxlength="12" placeholder="Nickname">
    <label>Color <input id="color" type="color" value="#3b82f6"></label>
    <button id="start">Join game</button>
  </div>
</div>

<div id="crosshair"></div>
<div id="hud" class="hudtext"></div>
<div id="role" class="hudtext"></div>
<div id="timer" class="hudtext"></div>
<div id="banner" class="hudtext"></div>
<div id="roles" class="hudtext"></div>
<div id="toast" class="hudtext"></div>
<div id="help" class="hudtext">WASD move · Space jump · Mouse look (click to lock) · Left click: stab / shoot / switch spectate · Esc: release mouse</div>

<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }
</script>
<script type="module" src="game.js"></script>
</body>
</html>
